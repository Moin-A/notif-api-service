apiVersion: apps/v1
kind: Deployment
metadata:
  name: notif-worker
  namespace: notif
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notif-worker
  template:
    metadata:
      labels:
        app: notif-worker
    spec:
      containers:
        - name: notif-worker
          image: moindev/notif-api-service:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.worker"]
          env:
            - name: REDIS_URL
              value: "redis://redis.reptrack.svc.cluster.local:6379/2"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notif-secrets
                  key: DATABASE_URL
            # Rails secret_key_base — kept for parity with the API pod.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notif-secrets
                  key: JWT_SECRET
            # VAPID pair — the worker is what sends the web pushes.
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: notif-secrets
                  key: VAPID_PRIVATE_KEY
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: notif-secrets
                  key: VAPID_PUBLIC_KEY
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: notif-secrets
                  key: VAPID_SUBJECT
